<div class="flex h-screen w-full bg-editorial-bg text-editorial-text overflow-hidden selection:bg-editorial-text selection:text-editorial-bg">
  <!-- Sidebar -->
  <aside class="w-64 flex-shrink-0 border-r border-editorial-text/20 bg-editorial-bg">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Main Content Area -->
  <div class="flex flex-1 flex-col min-w-0 overflow-hidden">
    <!-- Topbar -->
    <header class="h-16 flex-shrink-0 border-b border-editorial-text/20 bg-editorial-bg z-10 w-full">
      <app-topbar></app-topbar>
    </header>

    <!-- Offline Banner -->
    <app-offline-banner></app-offline-banner>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-8 bg-editorial-bg relative" (click)="layoutService.closeAllOverlays()">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Overlays -->
  <app-notification-toast></app-notification-toast>
  <app-context-menu></app-context-menu>
</div>
