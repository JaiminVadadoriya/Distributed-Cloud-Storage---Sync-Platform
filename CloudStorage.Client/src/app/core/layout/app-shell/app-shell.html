<div class="flex h-screen w-full bg-editorial-bg text-editorial-text overflow-hidden selection:bg-editorial-text selection:text-editorial-bg">
  <!-- Sidebar -->
  <aside class="w-64 flex-shrink-0 border-r border-editorial-text/20 bg-editorial-bg">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Main Content Area -->
  <div class="flex flex-1 flex-col min-w-0 overflow-hidden">
    <!-- Topbar -->
    <header class="h-16 flex-shrink-0 border-b border-editorial-text/20 bg-editorial-bg z-10 w-full">
      <app-topbar></app-topbar>
    </header>

    <!-- Offline Banner -->
    <app-offline-banner></app-offline-banner>

    <!-- Sync Status Floating Panel -->
    <app-sync-status class="absolute bottom-6 right-6 z-40"></app-sync-status>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto p-6 lg:p-8 bg-editorial-bg relative shadow-inner" 
          (click)="layoutService.closeAllOverlays()"
          (keydown.escape)="layoutService.closeAllOverlays()"
          tabindex="0">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Global Overlays -->
  <app-notification-toast></app-notification-toast>
  <app-context-menu></app-context-menu>
  <app-upload-modal></app-upload-modal>
  
  <app-confirm-modal
    *ngIf="layoutService.confirmModal() as config"
    [isOpen]="config.isOpen"
    [title]="config.title"
    [message]="config.message"
    [danger]="config.danger ?? false"
    (confirm)="config.action()"
    (cancel)="layoutService.closeConfirm()">
  </app-confirm-modal>

  <app-prompt-modal
    *ngIf="layoutService.promptModal() as config"
    [isOpen]="config.isOpen"
    [title]="config.title"
    [message]="config.message ?? ''"
    [initialValue]="config.initialValue ?? ''"
    [placeholder]="config.placeholder ?? 'Enter_Value'"
    (submit)="config.action($event)"
    (cancel)="layoutService.closePrompt()">
  </app-prompt-modal>
</div>
