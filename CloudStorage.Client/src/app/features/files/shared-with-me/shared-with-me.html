<div class="shared-with-me">
  <h3 class="page-title">Shared With Me</h3>

  @if (isBusy()) {
    <div class="loading-state"><div class="spinner"></div><p>Loading shared files...</p></div>
  } @else if (files().length === 0) {
    <div class="empty-state">
      <p>No files have been shared with you yet</p>
    </div>
  } @else {
    <div class="file-grid">
      @for (file of files(); track file.id) {
        <div class="file-card">
          <div class="file-info">
            <span class="file-icon">📄</span>
            <div class="file-meta">
              <span class="file-name">{{ file.name }}</span>
              <span class="file-detail">{{ formatSize(file.size) }} · from {{ file.owner }}</span>
            </div>
          </div>
          <button class="download-btn" (click)="downloadFile(file.id, file.name)">⬇</button>
        </div>
      }
    </div>
  }
</div>
