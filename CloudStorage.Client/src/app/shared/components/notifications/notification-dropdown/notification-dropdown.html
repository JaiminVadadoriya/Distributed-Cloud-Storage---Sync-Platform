<div class="notification-container">
  <button class="bell-btn" (click)="toggle()">
    🔔
    @if (unreadCount() > 0) {
      <span class="badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="dropdown">
      <div class="dropdown-header">
        <span>Notifications</span>
        @if (unreadCount() > 0) {
          <button class="mark-all-btn" (click)="markAllAsRead()">Mark all read</button>
        }
      </div>
      <div class="dropdown-body">
        @if (notifications().length === 0) {
          <p class="empty">No notifications</p>
        } @else {
          @for (n of notifications(); track n.id) {
            <div class="notification-item" [class.unread]="!n.isRead" (click)="markAsRead(n.id)">
              <div class="notif-content">
                <span class="notif-title">{{ n.title }}</span>
                <span class="notif-message">{{ n.message }}</span>
              </div>
              <span class="notif-time">{{ getTimeAgo(n.createdAt) }}</span>
            </div>
          }
        }
      </div>
    </div>
  }
</div>
