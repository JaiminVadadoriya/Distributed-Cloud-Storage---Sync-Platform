<div class="notification-container">
  <button class="bell-btn" (click)="toggle()">
    🔔
    @if (unreadCount() > 0) {
      <span class="badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="dropdown">
      <div class="dropdown-header">
        <span>Notifications</span>
        @if (unreadCount() > 0) {
          <button class="mark-all-btn" (click)="markAllAsRead()">Mark all read</button>
        }
      </div>
      <div class="dropdown-body">
        @if (notifications().length === 0) {
          <p class="empty">No notifications</p>
        } @else {
          @for (n of notifications(); track n.id) {
            <button class="notification-item w-full text-left p-4 border-b border-editorial-text/10 focus:outline-none focus:bg-editorial-text/5" 
                    [class.unread]="!n.isRead" 
                    (click)="markAsRead(n.id)"
                    [attr.aria-label]="'Notification: ' + n.title">
              <div class="notif-content flex flex-col gap-1">
                <span class="notif-title font-bold text-[11px]">{{ n.title }}</span>
                <span class="notif-message text-[10px] text-editorial-text/70">{{ n.message }}</span>
              </div>
              <span class="notif-time text-[9px] text-editorial-text/40 mt-2 block">{{ n.createdAt | date:'HH:mm' }}</span>
            </button>
          }
        }
      </div>
    </div>
  }
</div>
