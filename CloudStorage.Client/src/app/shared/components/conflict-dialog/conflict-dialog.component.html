<div class="fixed inset-0 z-[100] flex items-center justify-center bg-surface-900/40 backdrop-blur-sm p-4">
  <div class="bg-white dark:bg-surface-900 rounded-2xl shadow-xl w-full max-w-lg overflow-hidden border border-surface-200 dark:border-surface-800">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-surface-200 dark:border-surface-800 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-500 flex items-center justify-center flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
      </div>
      <div>
        <h3 class="text-lg font-semibold text-surface-900 dark:text-surface-100">Sync Conflict</h3>
        <p class="text-sm text-surface-500">Please resolve this conflict to continue syncing.</p>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6">
      <p class="text-sm text-surface-600 dark:text-surface-400 mb-4">
        The file <span class="font-semibold text-surface-900 dark:text-surface-100">Project_Requirements.docx</span> was modified both locally and on the server.
      </p>

      <div class="grid grid-cols-2 gap-4">
        <!-- Local Version -->
        <button (click)="resolve(conflicts[0].fileId, 'KeepLocal')" class="relative rounded-xl border-2 border-primary-500 bg-primary-50/50 dark:bg-primary-900/20 p-4 text-left transition-all hover:bg-primary-50 focus:outline-none">
          <div class="absolute top-2 right-2 text-primary-600">
             <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <h4 class="text-sm font-semibold text-surface-900 dark:text-surface-100 mb-1">Keep Local</h4>
          <p class="text-xs text-surface-500">Modified: Today, 10:45 AM</p>
          <p class="text-xs text-surface-500 mt-0.5">Size: 4.2 MB</p>
        </button>

        <!-- Server Version -->
        <button (click)="resolve(conflicts[0].fileId, 'KeepServer')" class="relative rounded-xl border border-surface-200 dark:border-surface-800 bg-white dark:bg-surface-900 p-4 text-left transition-all hover:bg-surface-50 dark:hover:bg-surface-800 focus:outline-none">
          <h4 class="text-sm font-semibold text-surface-900 dark:text-surface-100 mb-1">Keep Server</h4>
          <p class="text-xs text-surface-500">Modified: Today, 10:42 AM</p>
          <p class="text-xs text-surface-500 mt-0.5">Size: 4.1 MB</p>
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="px-6 py-4 border-t border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-800/30 flex justify-end gap-3">
      <button (click)="closed.emit()" class="px-4 py-2 text-sm font-medium text-surface-700 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 rounded-xl transition-colors">
        Cancel Sync
      </button>
      <button class="px-4 py-2 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-xl transition-colors shadow-sm focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-surface-900">
        Confirm Selection
      </button>
    </div>
  </div>
</div>
