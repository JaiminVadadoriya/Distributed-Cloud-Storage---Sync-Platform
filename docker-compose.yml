services:
  cloudstorage.api:
    image: ${DOCKER_REGISTRY-}cloudstorageapi
    build:
      context: .
      dockerfile: CloudStorage.API/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=CloudStorageDb;Username=postgres;Password=yourpassword
      - Jwt__Key=ThisIsASuperSecretKeyThatShouldBeLongEnoughForHS256Algorithm
      - Jwt__Issuer=CloudStorageApi
      - Jwt__Audience=CloudStorageClients
      - Storage__ChunkPath=/app/storage/chunks
      - AzureBlob__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    volumes:
      - storage_data:/app/storage/chunks
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cloudstorage-network

  cloudstorage.client:
    image: ${DOCKER_REGISTRY-}cloudstorageclient
    build:
      context: CloudStorage.Client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - cloudstorage.api
    networks:
      - cloudstorage-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CloudStorageDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudstorage-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - cloudstorage-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    command: "azurite --loose --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"
    networks:
      - cloudstorage-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  azurite_data:
    driver: local

networks:
  cloudstorage-network:
    driver: bridge
