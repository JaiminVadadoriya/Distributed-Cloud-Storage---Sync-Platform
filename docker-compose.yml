services:
  cloudstorage.api:
    image: ${DOCKER_REGISTRY-}cloudstorageapi
    build:
      context: .
      dockerfile: CloudStorage.API/Dockerfile
    # Note: Ports are removed so traffic must go through the NGINX load balancer
    deploy:
      replicas: 3
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-CloudStorageDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-yourpassword}
      - Jwt__Key=${JWT_KEY:-ThisIsASuperSecretKeyThatShouldBeLongEnoughForHS256Algorithm}
      - Jwt__Issuer=${JWT_ISSUER:-CloudStorageApi}
      - Jwt__Audience=${JWT_AUDIENCE:-CloudStorageClients}
      - StorageProvider__Active=MinIO
      - StorageProvider__MinIO__Endpoint=minio:9000
      - StorageProvider__MinIO__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - StorageProvider__MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - StorageProvider__MinIO__BucketName=${MINIO_BUCKET_NAME:-cloudstorage-chunks}
      - StorageProvider__MinIO__UseSSL=false
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=CloudStorage.API
    volumes:
      - storage_data:/app/storage/chunks
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - cloudstorage-network

  cloudstorage.client:
    image: ${DOCKER_REGISTRY-}cloudstorageclient
    build:
      context: CloudStorage.Client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - nginx
    networks:
      - cloudstorage-network

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cloudstorage.api:
        condition: service_healthy
    networks:
      - cloudstorage-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-CloudStorageDb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [ "postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "max_connections=200", "-c", "effective_cache_size=768MB" ]
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudstorage-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - cloudstorage-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloudstorage-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudstorage-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cloudstorage-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - cloudstorage-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped
    networks:
      - cloudstorage-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317"
    networks:
      - cloudstorage-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger
    networks:
      - cloudstorage-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  storage_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cloudstorage-network:
    driver: bridge
