apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudstorage-api-hpa
  namespace: cloud-storage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudstorage-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
