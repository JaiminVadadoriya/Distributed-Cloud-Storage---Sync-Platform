name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  # ─────────────────────────────────────────────
  # Backend: Restore → Build → Test
  # ─────────────────────────────────────────────
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: CloudStorageTestDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore CloudStorage.sln

      - name: Build solution
        run: dotnet build CloudStorage.sln --configuration Release --no-restore

      - name: Run Domain tests
        run: dotnet test tests/CloudStorage.Domain.Tests --configuration Release --no-build --logger "trx;LogFileName=domain-results.trx" --results-directory ./TestResults

      - name: Run Application tests
        run: dotnet test tests/CloudStorage.Application.Tests --configuration Release --no-build --logger "trx;LogFileName=application-results.trx" --results-directory ./TestResults

      - name: Run Infrastructure tests
        run: dotnet test tests/CloudStorage.Infrastructure.Tests --configuration Release --no-build --logger "trx;LogFileName=infrastructure-results.trx" --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=CloudStorageTestDb;Username=postgres;Password=testpassword"

      - name: Run API tests
        run: dotnet test tests/CloudStorage.API.Tests --configuration Release --no-build --logger "trx;LogFileName=api-results.trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ./TestResults/*.trx

  # ─────────────────────────────────────────────
  # Frontend: Install → Lint → Test → Build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudStorage.Client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: CloudStorage.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: CloudStorage.Client/dist/

  # ─────────────────────────────────────────────
  # E2E: Playwright (mock mode, Chromium only)
  # ─────────────────────────────────────────────
  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    defaults:
      run:
        working-directory: CloudStorage.Client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: CloudStorage.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (mock mode)
        env:
          CI: true
          TEST_MODE: mock
        run: npm run e2e:fast

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: CloudStorage.Client/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-junit
          path: CloudStorage.Client/test-results.xml
          retention-days: 14

  # ─────────────────────────────────────────────
  # Docker: Build & Push Images
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CloudStorage.API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: CloudStorage.Client
          file: CloudStorage.Client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
