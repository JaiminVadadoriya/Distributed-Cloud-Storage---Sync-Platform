name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  # ─────────────────────────────────────────────
  # CodeQL Analysis for Static Security Scanning
  # ─────────────────────────────────────────────
  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dba2aab696b0521e11a182847a9561 # v3.26.11
        with:
          languages: 'csharp, javascript-typescript'

      - name: Setup .NET
        uses: actions/setup-dotnet@607f30098679c619b5b29f940c6e9a6573cbb02a # v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore CloudStorage.sln

      - name: Build C# API
        run: dotnet build CloudStorage.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dba2aab696b0521e11a182847a9561 # v3.26.11

  # ─────────────────────────────────────────────
  # Security Scan (IaC, Docker, and K8s Configs)
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan (IaC & Configs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Vulnerability Scanner (IaC)
        uses: aquasecurity/trivy-action@18f259c909653174eeab752d572c4c810d7a6411 # v0.29.0
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0' # Audit only, do not break the build
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # Backend: Restore → Build → Test & Coverage → Audit
  # ─────────────────────────────────────────────
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: CloudStorageTestDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@607f30098679c619b5b29f940c6e9a6573cbb02a # v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0c907a75c2c80ebcb7f08297f4d2eb70763296c5 # v4.2.1
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore CloudStorage.sln

      - name: NuGet Package Vulnerability Check
        run: dotnet list package --vulnerable --include-transitive

      - name: Build solution
        run: dotnet build CloudStorage.sln --configuration Release --no-restore

      - name: Run Domain tests
        run: dotnet test tests/CloudStorage.Domain.Tests --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=domain-results.trx"

      - name: Run Application tests
        run: dotnet test tests/CloudStorage.Application.Tests --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=application-results.trx"

      - name: Run Infrastructure tests
        run: dotnet test tests/CloudStorage.Infrastructure.Tests --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=infrastructure-results.trx"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=CloudStorageTestDb;Username=postgres;Password=testpassword"

      - name: Run API tests
        run: dotnet test tests/CloudStorage.API.Tests --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=api-results.trx"

      - name: Enforce Code Coverage Threshold (80%)
        uses: irongut/CodeCoverageSummary@c9a6b5722322cd7acd3450c18d1847e9ff158864 # v1.3.0
        with:
          filename: ./TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '80 80'

      - name: Generate SBOM
        uses: anchore/sbom-action@df80a983ac6d27390610897f2d9e7472cf497c23 # v0.17.9
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Upload test results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: backend-test-results
          path: ./TestResults/*.trx

  # ─────────────────────────────────────────────
  # Frontend: Install → Lint → Audit → Test → Build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudStorage.Client

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39630291d748f00153110279a09678e9947aa621 # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: CloudStorage.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular Linter
        run: npm run lint

      - name: npm Package Vulnerability Check
        run: npm audit --audit-level=high || echo "Vulnerabilities detected. Please review."

      - name: Run Frontend Tests (Vitest with Coverage)
        run: npm run test:ci

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-dist
          path: CloudStorage.Client/dist/

  # ─────────────────────────────────────────────
  # E2E: Playwright (Mock mode, Sharded, Multi-browser)
  # ─────────────────────────────────────────────
  e2e-test:
    name: Playwright E2E Tests - ${{ matrix.browser }} - Chunk ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [frontend-build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/2, 2/2]
    defaults:
      run:
        working-directory: CloudStorage.Client

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39630291d748f00153110279a09678e9947aa621 # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: CloudStorage.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests (mock mode)
        env:
          CI: true
          TEST_MODE: mock
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: CloudStorage.Client/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results (JUnit)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: playwright-junit-${{ matrix.browser }}-${{ strategy.job-index }}
          path: CloudStorage.Client/test-results.xml
          retention-days: 14

  # ─────────────────────────────────────────────
  # Docker: Build & Push Images
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c3040c11789d6e40ba7c2a033f6782a60d170c67 # v3.8.0

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@369eb22beea7891096bab198753a3d9ca04b19c2 # v5.6.1
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: CloudStorage.API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Client)
        id: meta-client
        uses: docker/metadata-action@369eb22beea7891096bab198753a3d9ca04b19c2 # v5.6.1
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Client image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: CloudStorage.Client
          file: CloudStorage.Client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
