name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  # ─────────────────────────────────────────────
  # Deploy to Staging
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/cloud-storage
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f

  # ─────────────────────────────────────────────
  # Smoke Tests on Staging
  # ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Wait for services to start
        run: sleep 30

      - name: Health check - API liveness
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            ${{ vars.STAGING_URL }}/health

      - name: Health check - API readiness
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            ${{ vars.STAGING_URL }}/health/ready

      - name: Health check - Client
        run: |
          curl --fail --retry 3 --retry-delay 5 \
            ${{ vars.STAGING_CLIENT_URL }}

  # ─────────────────────────────────────────────
  # Deploy to Production (manual approval)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/cloud-storage
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f

      - name: Verify production health
        run: |
          sleep 30
          curl --fail --retry 5 --retry-delay 10 \
            ${{ vars.PRODUCTION_URL }}/health/ready
